[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "triplet-sae-project"
version = "0.1.0"
description = "Triplet extraction with SAE feature analysis and interventions"
requires-python = ">=3.10"
dependencies = [
    "openai==2.7.2",
    "python-dotenv==1.2.1",
    "tiktoken==0.9.0",
]

[project.optional-dependencies]
finetune = [
    "torch==2.8.0",
    "transformers==4.57.0",
    "accelerate==1.10.1",
    "peft==0.19.1",
    "bitsandbytes==0.48.1",
    "huggingface-hub==0.35.3",
    "safetensors==0.5.3",
    "sentencepiece==0.2.0",
    "sae-lens==5.6.1",
]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
